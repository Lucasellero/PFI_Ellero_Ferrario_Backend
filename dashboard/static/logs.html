<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logs · Monitor de Actividad</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0a0b;
      --surface:  #141416;
      --surface2: #1c1c1f;
      --border:   #2c2c30;
      --primary:  #e4e4e7;
      --primary-ink: #0a0a0b;
      --activity: #8c7ae6;
      --danger:   #ff4d4d;
      --warning:  #e0b23e;
      --text:     #eaeaec;
      --muted:    #87878c;
      --mono:     'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .icon { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      border-radius: 4px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(0,0,0,.3);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      user-select: none;
      position: relative;
      z-index: 1;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text);
    }
    .logo-icon {
      width: 30px; height: 30px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      position: relative;
      color: var(--primary);
    }
    .logo-icon::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.35);
      animation: radar 2.4s ease-out infinite;
    }
    @keyframes radar {
      0%   { transform: scale(.55); opacity: .9; }
      100% { transform: scale(1.35); opacity: 0; }
    }
    .logo-icon .icon { width: 16px; height: 16px; }
    .logo-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 400; letter-spacing: normal; text-transform: none; color: var(--muted); margin-top: 1px; }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .status-pill.stopped {
      background: rgba(110,118,129,.12);
      color: var(--muted);
      border: 1px solid rgba(110,118,129,.25);
    }
    .status-pill.running {
      background: rgba(255,255,255,.12);
      color: var(--primary);
      border: 1px solid rgba(255,255,255,.3);
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .status-pill.running .status-dot { animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

    .spacer { flex: 1; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
      text-decoration: none;
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
    .btn-sm { padding: 4px 10px; font-size: 11px; }

    /* ── Logs panel ──────────────────────────────────────────────────────── */
    .logs-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #090d13;
      overflow: hidden;
      min-height: 0;
    }
    .panel-header {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      background: var(--surface);
    }
    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .logs-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 14px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.7;
    }
    .logs-scroll::-webkit-scrollbar { width: 5px; }
    .logs-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .log-line { white-space: pre-wrap; word-break: break-all; }
    .log-line.info    { color: #768390; }
    .log-line.warning { color: var(--warning); }
    .log-line.error   { color: var(--danger); }
    .log-line.system  { color: var(--primary); font-weight: 600; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
</svg>

<!-- Header -->
<header>
  <div class="logo">
    <span class="logo-icon"><svg class="icon"><use href="#icon-eye"/></svg></span>
    <div>
      <div>Logs del sistema</div>
      <div class="logo-sub">Sistema local de detección de caídas</div>
    </div>
  </div>

  <div class="status-pill stopped" id="statusPill">
    <span class="status-dot"></span>
    <span id="statusLabel">APAGADO</span>
  </div>

  <div class="spacer"></div>

  <a class="btn btn-ghost" href="/">← Volver al panel</a>
</header>

<!-- Logs -->
<div class="logs-panel">
  <div class="panel-header">
    <span class="section-label">Logs del sistema</span>
    <div class="spacer"></div>
    <button class="btn btn-ghost btn-sm" onclick="clearLogs()">Limpiar</button>
  </div>
  <div class="logs-scroll" id="logsScroll">
    <div class="log-line system">Panel listo · esperando conexión al runner…</div>
  </div>
</div>

<script>
let ws = null;

window.addEventListener('DOMContentLoaded', connectWS);

function connectWS() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen  = () => addLog('system', '● Conectado al servidor.');
  ws.onclose = () => {
    addLog('system', '✕ Conexión cerrada. Reconectando en 3 s…');
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => {};
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'status': applyStatus(msg.running); break;
      case 'log':    addLog(classifyLog(msg.text), msg.text); break;
      case 'ping':   break;
    }
  };
}

function applyStatus(running) {
  const pill  = document.getElementById('statusPill');
  const label = document.getElementById('statusLabel');
  pill.className    = 'status-pill ' + (running ? 'running' : 'stopped');
  label.textContent = running ? 'ACTIVO' : 'APAGADO';
}

function classifyLog(text) {
  if (/ERROR/i.test(text))        return 'error';
  if (/WARNING|WARN/i.test(text)) return 'warning';
  if (/^[▶■●✕]/.test(text.trimStart())) return 'system';
  return 'info';
}

function addLog(cls, text) {
  const scroll   = document.getElementById('logsScroll');
  const atBottom = scroll.scrollHeight - scroll.scrollTop <= scroll.clientHeight + 40;
  const line = document.createElement('div');
  line.className   = `log-line ${cls}`;
  line.textContent = text;
  scroll.appendChild(line);
  if (atBottom) scroll.scrollTop = scroll.scrollHeight;
  while (scroll.children.length > 600) scroll.removeChild(scroll.firstChild);
}

function clearLogs() {
  document.getElementById('logsScroll').innerHTML = '';
}
</script>
</body>
</html>
