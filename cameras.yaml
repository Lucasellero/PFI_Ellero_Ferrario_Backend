cameras:
- id: webcam
  source: http://0.0.0.0:8080/stream.mjpg
  realtime: true
  loop: false
  # zones: opcional, configuración manual una sola vez por cámara real (ver
  # runner/README.md, sección "Clasificación de actividades (CLIP)", y
  # fusion/src/zone_context.py). Sin esta clave, el sistema funciona igual
  # que hoy — la mejora medida (+6pts Cooking, ver vlm/README.md "Fase 1 de
  # PLAN_sustitucion_clip.md...") solo aplica una vez que se dibujan los
  # polígonos reales de ESTA cámara. Ejemplo de esquema (comentado, no
  # activo — coordenadas normalizadas 0-1, [x,y] por vértice, en el orden
  # que se camina el polígono):
  # zones:
  #   cocina: [[0.0, 0.3], [0.6, 0.3], [0.6, 0.9], [0.0, 0.9]]
  #   mesa:   [[0.6, 0.4], [1.0, 0.4], [1.0, 0.9], [0.6, 0.9]]
pose_model: yolo11n-pose.pt
log_level: INFO
clip_heartbeat_s: 0
# cloud: opcional, sincronización de eventos al backend cloud (ver cloud/README.md y
# runner/cloud_sync.py). Sin esta clave, el sistema funciona igual que hoy — 100% local, nada
# sale de la Pi. "url" es la base del backend (sin /devices/events al final), "api_key" es la
# que muestra una sola vez el alta del kit (cloud/alta_kit.py, ver "Correr localmente" en cloud/README.md).
# Ejemplo (comentado, no activo):
# cloud:
#   url: https://monitor-api.ejemplo.com
#   api_key: "la-api-key-del-kit"
#   interval_s: 30
